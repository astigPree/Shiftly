{% load form_tags %}
<div class="field form-field{% if full_width %} form-field--full{% endif %}{% if field.field.widget.input_type == 'checkbox' %} form-field--checkbox{% endif %}{% if field.errors %} form-field--invalid{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="form-checkbox" for="{{ field.id_for_label }}">
      {{ field|accessible_field }}
      <span class="form-checkbox__copy">
        <strong>{{ field.label }}</strong>
        {% if field.help_text %}<small class="form-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
      </span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field|accessible_field }}
    {% if field.help_text %}<small class="form-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% endif %}
  {% if field.errors %}<div id="{{ field.auto_id }}_errors" class="field-error" role="alert">{{ field.errors }}</div>{% endif %}
</div>
