{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Shiftly{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'assets/shiftly-mark.svg' %}">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
  <link rel="stylesheet" href="{% static 'css/employee.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
  <link rel="stylesheet" href="{% static 'css/timesheets.css' %}">
  <link rel="stylesheet" href="{% static 'css/reports.css' %}">
  <link rel="stylesheet" href="{% static 'css/accessibility.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block page %}
    <main class="page-shell">
      {% block messages %}{% include "components/messages.html" %}{% endblock %}
      {% block content %}{% endblock %}
    </main>
  {% endblock %}
  <script src="{% static 'js/toasts.js' %}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
