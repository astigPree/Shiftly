name: shiftly

x-app: &app
  image: shiftly:${IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  environment: &app-env
    DEBUG: "false"
    SECRET_KEY_FILE: /run/secrets/django_secret_key
    DATABASE_URL: postgresql://${POSTGRES_USER:-shiftly}@db:5432/${POSTGRES_DB:-shiftly}
    DATABASE_PASSWORD_FILE: /run/secrets/db_password
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
    SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
    EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
    EMAIL_HOST: ${EMAIL_HOST:-}
    EMAIL_PORT: ${EMAIL_PORT:-587}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
    EMAIL_HOST_PASSWORD_FILE: /run/secrets/email_password
    EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@shiftly.local}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  secrets:
    - django_secret_key
    - db_password
    - email_password
  volumes:
    - staticfiles:/app/staticfiles
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shiftly}
      POSTGRES_USER: ${POSTGRES_USER:-shiftly}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  initialize:
    <<: *app
    command: ["python", "-m", "deploy.initialize"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "deploy/healthcheck.py"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 4
    restart: unless-stopped

  proxy:
    image: nginx:stable-alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/srv/static:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  staticfiles:

secrets:
  django_secret_key:
    file: ./.secrets/django_secret_key.txt
  db_password:
    file: ./.secrets/db_password.txt
  email_password:
    file: ./.secrets/email_password.txt
